[project]
name = "text-to-image-generation"
version = "0.1.0"
description = "Text-to-image generation on COCO 2017 captions (Stable Diffusion / CLIP / BERT)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=4.46.0",
    "diffusers>=0.31.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.5",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "pandas==2.3.3",
    "pyarrow>=18.0.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.66.0",
    "ftfy>=6.3.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.3.0",
    "scikit-learn>=1.9.1",
]

# CUDA 12.8 wheels on Linux/Windows; macOS has no CUDA builds, so it falls back to the
# default PyPI wheels, which include Apple Silicon (MPS) support.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
